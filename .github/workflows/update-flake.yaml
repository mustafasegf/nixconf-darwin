---
{
  name: "update-flake",
  "on": {
    schedule: [{
      cron: "0 19 * * 0",
    }],
    workflow_dispatch: {},
  },
  concurrency: {
    group: "update-flake",
    cancel-in-progress: false,
  },
  permissions: {
    contents: "write",
    issues: "write",
  },
  jobs: {
    update: {
      runs-on: [
        "self-hosted",
        "nix",
      ],
      steps: [{
        uses: "actions/checkout@v5",
      }, {
        name: "Update flake inputs",
        run: "\
           git config user.name \"github-actions[bot]\"\n\
           git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n\
           nix flake update --commit-lock-file\n\
          ",
      }, {
        name: "Build Linux hosts",
        run: "\
           nix build --print-build-logs --out-link result \\\n\
           .#nixosConfigurations.mustafa-pc.config.system.build.toplevel \\\n\
           .#nixosConfigurations.minipc.config.system.build.toplevel \\\n\
           .#nixosConfigurations.greencloud.config.system.build.toplevel\n\
          ",
      }, {
        name: "Push to cache",
        env: {
          ATTIC_TOKEN: "${{ secrets.ATTIC_TOKEN }}",
        },
        run: "\
           attic login local http://127.0.0.1:8080 \"$ATTIC_TOKEN\"\n\
           attic push local:mus result*\n\
          ",
      }, {
        name: "Push lock update to master",
        run: "git push origin HEAD:master",
      }, {
        name: "Push failed update for manual fixing",
        if: "failure()",
        run: "git push --force origin HEAD:flake-update",
      }, {
        name: "Open issue on failure",
        if: "failure()",
        uses: "actions/github-script@v8",
        with: {
          script: "\
             const title = 'Weekly flake update failed';\n\
             const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;\n\
             const body = `Run: ${run}\\nBranch with the attempted update: \\`flake-update\\``;\n\
             const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', creator: 'github-actions[bot]' });\n\
             const existing = open.find(i => i.title === title);\n\
             if (existing) {\n\
            \  await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });\n\
             } else {\n\
            \  await github.rest.issues.create({ ...context.repo, title, body, assignees: [context.repo.owner] });\n\
             }\n\
            ",
        },
      }],
    },
  },
}
